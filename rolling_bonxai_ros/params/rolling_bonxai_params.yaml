rolling_bonxai_server_node:
  ros__parameters:
    # Set true when a simulator (Gazebo, Isaac, a bag replayed with --clock)
    # publishes /clock. Every timer in the node and all chunk ageing then follow
    # simulated time instead of the wall clock. Nothing fires until /clock
    # starts publishing, which is the expected behaviour.
    use_sim_time: false

    frame_id: "map"
    base_frame_id: "zed_camera_link"
    topic_in: "/zed/zed_node/point_cloud/cloud_registered"

    occupancy:
      resolution: 0.05
      occupancy_min_z: -100.0
      occupancy_max_z: 100.0
      occupancy_threshold: 0.50

    sensor_model:
      max_range: 10.0
      hit: 0.7
      miss: 0.4
      min: 0.12
      max: 0.97

    rolling:
      coordinate_system:
        chunk_size: 2.0 #double m

      transition_manager:
        hysteresis_ratio: 0.2 #[0.01,1.0]

      loading_policy:
        # "neighbourhood" (or "neighborhood"), "planar", "temporal" ##String
        name: "neighbourhood"
        neighborhood:
          radius: 2 #int
        planar:
          radius: 1 #int
          z_min: 0 #int
          z_max: 2 #int
          use_relative: true #bool
        temporal:
          radius: 2 #int
          age_weightage: 0.3 #[0.01,1.0] double
          # Seconds on the node clock. Under use_sim_time these are simulated
          # seconds, so the value means the same thing at any real-time factor.
          max_age_s: 300 #int in seconds

      storage:
        # Must be writable by this process. Ignored while enable_io is false;
        # if enable_io is true and this is empty or unwritable, the node logs an
        # error and falls back to memory-only operation.
        full_save_folder_path: "/tmp/bonxai_chunks"

      asyncio:
        enable_io: false
        num_load_threads: 3 #int
        num_save_threads: 1 #int

    server:
      # Seconds between automatic releaseUnusedMemory()/shrinkToFit() passes.
      # Set <= 0.0 to disable and rely solely on the clean_memory service.
      cleanup_interval_sec: 120.0
      # Seconds to block waiting for the sensor -> frame_id transform.
      tf_timeout_sec: 0.1

    stats:
      enable_stats: true
      # true  -> O(1) counters only
      # false -> full per-cell iteration (bounding box, probability spread).
      #          Expensive on large maps.
      quick_stats: true
      publish_occupied_voxels: true
      publish_rate: 3.0 #Hz
      chunk_vis_publish_rate: 1.0 #Hz
